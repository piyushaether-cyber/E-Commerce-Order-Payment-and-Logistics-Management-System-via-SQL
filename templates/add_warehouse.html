
<!DOCTYPE html>
<html>
<head>
    <title>Add Warehouse - ShopAdmin</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="main">

        <div class="topbar">
            <h2>Add Warehouse</h2>
            <a href="{{ url_for('warehouses') }}">Back to Warehouses</a>
        </div>

        <h1>New Warehouse</h1>
        <p class="subtitle">Enter warehouse details below.</p>

        <div class="orders">

            
        <form method="POST" style="max-width:600px;">

            <label>Warehouse Name</label>
            <input type="text" name="warehouse_name"
                maxlength="80" required
                style="width:100%; padding:12px; margin:8px 0 18px;
                        border:1px solid #ddd; border-radius:6px;">

            <label>City</label>
            <input type="text" name="city"
                maxlength="50" required
                style="width:100%; padding:12px; margin:8px 0 18px;
                        border:1px solid #ddd; border-radius:6px;">

            <label>State</label>
            <input type="text" name="state"
                maxlength="50" required
                style="width:100%; padding:12px; margin:8px 0 18px;
                        border:1px solid #ddd; border-radius:6px;">

            <label>Region</label>
            <select name="region" required
                    style="width:100%; padding:12px; margin:8px 0 18px;
                        border:1px solid #ddd; border-radius:6px;">
                <option value="">Select Region</option>
                <option value="NORTH">North</option>
                <option value="SOUTH">South</option>
                <option value="EAST">East</option>
                <option value="WEST">West</option>
                <option value="CENTRAL">Central</option>
            </select>

            <label>Contact Phone</label>
            <input type="tel" name="contact_phone"
                maxlength="15"
                style="width:100%; padding:12px; margin:8px 0 18px;
                        border:1px solid #ddd; border-radius:6px;">

            <button type="submit"
                    style="background:#2563eb; color:white; padding:12px 22px;
                        border:0; border-radius:6px; cursor:pointer;">
                Save Warehouse
            </button>

            <a href="{{ url_for('warehouses') }}"
            style="margin-left:12px;">Cancel</a>

        </form>


        </div>

    </div>

</body>
</html>
