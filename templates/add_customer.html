
<!DOCTYPE html>
<html>
<head>
    <title>Add Customer | E-Commerce Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="sidebar">
    <h2>E-Commerce</h2>

    <h4>MAIN MENU</h4>
    <a href="/">Dashboard</a>
    <a href="/products">Products</a>
    <a href="/customers" class="active">Customers</a>
    <a href="#">Categories</a>
    <a href="#">Addresses</a>

    <h4>SALES MANAGEMENT</h4>
    <a href="#">Carts & Cart Items</a>
    <a href="/orders">Orders & Order Items</a>
    <a href="/payments">Payments</a>
    <a href="#">Refunds</a>

    <h4>INVENTORY & LOGISTICS</h4>
    <a href="/inventory">Inventory</a>
    <a href="#">Warehouses</a>
    <a href="#">Shipments</a>
    <a href="#">Delivery Status</a>
</div>

<div class="main-content">

    <h1>Add Customer</h1>
    <p>Enter the new customer's details below.</p>

    <div class="customer-form-container">
    <form method="POST" action="/customers/add" class="customer-form">

        <label>First Name *</label>
        <input type="text" name="first_name" required>

        <label>Last Name</label>
        <input type="text" name="last_name">

        <label>Email *</label>
        <input type="email" name="email" required>

        <label>Phone</label>
        <input type="tel" name="phone">

        <label>Password *</label>
        <input type="password" name="password" required>

        <label>Date of Birth</label>
        <input type="date" name="date_of_birth">

        <br><br>

        <button type="submit">Add Customer</button>
        <a href="/customers">Cancel</a>

    </form>
    </div>

</div>

</body>
</html>
