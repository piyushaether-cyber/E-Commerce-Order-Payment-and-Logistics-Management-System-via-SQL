
<!DOCTYPE html>
<html>
<head>
    <title>Add Category | E-Commerce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="sidebar">
    <h2>E-Commerce</h2>

    <h4>MAIN MENU</h4>
    <a href="/">Dashboard</a>
    <a href="/products">Products</a>
    <a href="/customers">Customers</a>
    <a href="/categories" class="active">Categories</a>
    <a href="/addresses">Addresses</a>

    <h4>SALES MANAGEMENT</h4>
    <a href="#">Carts & Cart Items</a>
    <a href="/orders">Orders & Order Items</a>
    <a href="/payments">Payments</a>
    <a href="#">Refunds</a>

    <h4>INVENTORY & LOGISTICS</h4>
    <a href="/inventory">Inventory</a>
    <a href="#">Warehouses</a>
    <a href="#">Shipments</a>
    <a href="#">Delivery Status</a>
</div>

<div class="main-content">

    <h1>Add Category</h1>
    <p>Enter the new product category details.</p>

    <div class="customer-form-container">

        <form method="POST" class="customer-form">

            <label>Category Name *</label>
            <input type="text" name="category_name" required>

            <label>Parent Category</label>
            <select name="parent_category_id">
                <option value="">None (Main Category)</option>

                {% for parent in parent_categories %}
                <option value="{{ parent[0] }}">
                    {{ parent[1] }}
                </option>
                {% endfor %}
            </select>

            <label>Description</label>
            <textarea name="description" rows="4"></textarea>

            <br><br>

            <button type="submit">Add Category</button>
            <a href="/categories">Cancel</a>

        </form>

    </div>

</div>

</body>
</html>
