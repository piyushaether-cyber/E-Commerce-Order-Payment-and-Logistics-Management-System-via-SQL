
<!DOCTYPE html>
<html>
<head>
    <title>Add Address | E-Commerce Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="sidebar">
    <h2>E-Commerce</h2>

    <h4>MAIN MENU</h4>
    <a href="/">Dashboard</a>
    <a href="/products">Products</a>
    <a href="/customers">Customers</a>
    <a href="#">Categories</a>
    <a href="/addresses" class="active">Addresses</a>

    <h4>SALES MANAGEMENT</h4>
    <a href="#">Carts & Cart Items</a>
    <a href="/orders">Orders & Order Items</a>
    <a href="/payments">Payments</a>
    <a href="#">Refunds</a>

    <h4>INVENTORY & LOGISTICS</h4>
    <a href="/inventory">Inventory</a>
    <a href="#">Warehouses</a>
    <a href="#">Shipments</a>
    <a href="#">Delivery Status</a>
</div>

<div class="main-content">

    <h1>Add Address</h1>
    <p>Enter the customer's delivery address.</p>

    <div class="customer-form-container">

        <form method="POST" class="customer-form">

            <label>Customer *</label>
            <select name="customer_id" required>
                <option value="">Select Customer</option>

                {% for customer in customers %}
                <option value="{{ customer[0] }}">
                    {{ customer[0] }} - {{ customer[1] }} {{ customer[2] or '' }}
                </option>
                {% endfor %}
            </select>

            <label>Address Line 1 *</label>
            <input type="text" name="address_line1" required>

            <label>Address Line 2</label>
            <input type="text" name="address_line2">

            <label>City *</label>
            <input type="text" name="city" required>

            <label>State *</label>
            <input type="text" name="state" required>

            <label>Pincode *</label>
            <input type="text" name="pincode" required>

            <label>Country</label>
            <input type="text" name="country" value="India">

            <label>Address Type *</label>
            <select name="address_type" required>
                <option value="HOME">HOME</option>
                <option value="WORK">WORK</option>
                <option value="OTHER">OTHER</option>
            </select>

            <label>Default Address *</label>
            <select name="is_default" required>
                <option value="N">No</option>
                <option value="Y">Yes</option>
            </select>

            <br><br>

            <button type="submit">Add Address</button>
            <a href="/addresses">Cancel</a>

        </form>

    </div>

</div>

</body>
</html>
